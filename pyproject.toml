[project]
name = "overmind"
version = "0.1.0"
description = "A meta-harness composition layer over Omnigent, Open Multi-Agent, and Ruflo"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# Deliberately thin. The orchestration engine, sandbox, and memory store are
# external processes (omnigent CLI, OMA bridge, ruflo MCP), not Python deps.
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
overmind = "overmind.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

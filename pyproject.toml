[project]
name = "overmind"
version = "0.1.0"
description = "A meta-harness composition layer over Omnigent, Open Multi-Agent, and Ruflo"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# Deliberately thin. The orchestration engine, sandbox, and memory store are
# external processes (omnigent CLI, OMA bridge, ruflo MCP), not Python deps.
# pyyaml is here because agent specs are YAML and Omnigent reads them; writing
# YAML by hand-rolled serializer would be a bug factory for no benefit.
#
# Each requirement is bounded at the next major. Lower bounds alone are an
# open invitation for a breaking release to land in a checkout nobody touched,
# and this repo has no committed lockfile to catch it -- see docs/PINS.md.
# Pydantic in particular is load-bearing: every model, gate input, and config
# validator goes through it.
dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "tomli-w>=1.0,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# Bounded for the same reason, and more tightly for the two that gate CI: a
# ruff or mypy major can turn a green checkout red without a code change.
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
overmind = "overmind.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

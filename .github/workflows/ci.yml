name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    # The rewriter, router, and gates are pure functions over plan data, so the
    # whole suite runs with no model calls, no network, and no upstreams.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check overmind tests
      - run: mypy overmind
      - run: pytest -q
      - name: config validates
        run: python -c "import overmind.config as c; c.load(); print('ok')"

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: bridge
      - run: npm run typecheck
        working-directory: bridge

  upstream-contracts:
    # ADR-001 buys upstream fixes for free and inherits upstream churn. Ruflo
    # alone has shipped 1,488 releases. This job exists so drift breaks loudly
    # here rather than quietly in someone's run.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v3

      - name: omnigent CLI still exposes the flags executor.py passes
        run: |
          uv tool install --python 3.12 omnigent
          omnigent run --help > help.txt 2>&1 || true
          for flag in --harness --cwd --non-interactive --json --policy; do
            grep -q -- "$flag" help.txt || echo "::warning::omnigent run no longer documents $flag"
          done

      - name: ruflo still exposes the four allowlisted memory tools
        run: |
          npx --yes ruflo@latest --version || echo "::warning::ruflo CLI unavailable"

      - name: open-multi-agent still exports OpenMultiAgent
        working-directory: bridge
        run: |
          npm install
          node -e "import('@open-multi-agent/core').then(m => { if (!m.OpenMultiAgent) { console.log('::warning::OpenMultiAgent export missing'); process.exit(0) } console.log('ok') })"

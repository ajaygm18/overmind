name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    # The rewriter, router, and gates are pure functions over plan data, so the
    # whole suite runs with no model calls, no network, and no upstreams.
    # tests/contracts is excluded here and owned by the contracts job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check overmind tests
      - run: mypy overmind
      - run: pytest -q --ignore=tests/contracts
      - name: MAST coverage table is generated, not typed
        # docs/MAST-COVERAGE.md is derived from tests/mast/. A mode added to the
        # docs without a trace, or a trace whose gate disagrees with the docs,
        # fails here rather than ageing quietly into a false claim.
        run: python tools/gen_coverage.py --check
      - name: config validates
        run: python -c "import overmind.config as c; c.load(); print('ok')"

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: bridge
      - run: npm run typecheck
        working-directory: bridge

  upstream-contracts:
    # ADR-001 buys upstream fixes for free and inherits upstream churn. Ruflo
    # alone has shipped 1,488 releases. This job exists so drift breaks loudly
    # here rather than quietly in someone's run.
    #
    # Deliberately NOT continue-on-error. The tests already separate the two
    # cases: unreachable upstreams skip, changed upstreams fail. Marking the
    # whole job non-blocking is how the previous version became decorative --
    # it emitted ::warning:: lines for a contract that no longer existed and
    # nothing ever went red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev]"

      - name: install omnigent
        run: uv tool install --python 3.12 omnigent || echo "omnigent unavailable; its tests will skip"

      - name: observed upstream versions
        run: echo "### Observed upstream versions" >> "$GITHUB_STEP_SUMMARY"

      - name: contract tests
        # -rs prints the skip reasons, so 'unreachable' is visible in the log
        # and never mistaken for 'passed'.
        env:
          OVERMIND_CONTRACTS: "1"
        run: pytest tests/contracts -q -rs
